name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build and publish a release
        required: false
        default: false
        type: boolean
      bump:
        description: Release version bump
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

jobs:
  linux:
    name: Linux · Ubuntu 26.04
    if: inputs.release != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-declarative-private-dev \
            qt6-declarative-dev-tools \
            qt6-wayland \
            qt6-wayland-dev \
            qt6-wayland-private-dev \
            qt6-shadertools-dev \
            qt6-shader-baker \
            qt6-svg-plugins \
            spirv-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libplacebo-dev \
            libcubeb-dev \
            libass-dev \
            libvulkan-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libva-dev \
            libdrm-dev \
            weston \
            pulseaudio \
            pulseaudio-utils \
            mesa-vulkan-drivers \
            vulkan-tools

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B "$RUNNER_TEMP/sunplayer-linux-debug" -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: >-
          cmake --build "$RUNNER_TEMP/sunplayer-linux-debug"
          --parallel "$(nproc)"

      - name: Lint QML
        run: >-
          cmake --build "$RUNNER_TEMP/sunplayer-linux-debug"
          --target all_qmllint
          --parallel "$(nproc)"

      - name: Test
        run: |
          BUILD_DIR="$RUNNER_TEMP/sunplayer-linux-debug"
          WAYLAND_RUNTIME=/tmp/sunplayer-wayland-runtime
          PULSE_RUNTIME=/tmp/sunplayer-pulse-runtime
          WESTON_LOG=/tmp/sunplayer-weston.log
          PULSE_LOG=/tmp/sunplayer-pulse.log
          WESTON_PID=
          PULSE_PID=

          stop_process() {
            local pid=$1
            local name=$2

            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null
              for attempt in {1..40}; do
                if ! kill -0 "$pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
            fi

            if kill -0 "$pid" 2>/dev/null; then
              echo "$name did not exit after 10 seconds; killing it" >&2
              kill -KILL "$pid" 2>/dev/null
            fi
            wait "$pid" 2>/dev/null
          }

          cleanup() {
            status=$?
            trap - EXIT
            set +e

            if [[ -n "$WESTON_PID" ]]; then
              stop_process "$WESTON_PID" Weston
            fi
            if [[ -n "$PULSE_PID" ]]; then
              stop_process "$PULSE_PID" PulseAudio
            fi

            if (( status != 0 )); then
              echo "Weston log:"
              tail -n 240 "$WESTON_LOG" 2>/dev/null
              echo "PulseAudio log:"
              tail -n 240 "$PULSE_LOG" 2>/dev/null
            fi

            exit "$status"
          }
          trap cleanup EXIT

          install -d -m 0700 "$WAYLAND_RUNTIME"
          install -d -o pulse -g pulse -m 0755 "$PULSE_RUNTIME"

          export XDG_RUNTIME_DIR="$WAYLAND_RUNTIME"
          export WAYLAND_DISPLAY=wayland-sunplayer
          export QT_QPA_PLATFORM=wayland

          weston \
            --backend=headless \
            --renderer=pixman \
            --no-config \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --width=1920 \
            --height=1080 \
            --log="$WESTON_LOG" &
          WESTON_PID=$!

          for attempt in {1..120}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            if ! kill -0 "$WESTON_PID" 2>/dev/null; then
              echo "Weston exited before creating its Wayland socket" >&2
              exit 1
            fi
            sleep 0.25
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            echo "Weston did not create its Wayland socket within 30 seconds" >&2
            exit 1
          fi
          if ! kill -0 "$WESTON_PID" 2>/dev/null; then
            echo "Weston exited after creating its Wayland socket" >&2
            exit 1
          fi

          export PULSE_SERVER="unix:$PULSE_RUNTIME/native"
          export PULSE_SINK=sunplayer_ci

          pulseaudio \
            --system \
            --daemonize=no \
            --fail=yes \
            --disallow-exit=yes \
            --disallow-module-loading=yes \
            --realtime=no \
            --high-priority=no \
            -n \
            -L "module-native-protocol-unix socket=$PULSE_RUNTIME/native auth-anonymous=1" \
            -L "module-null-sink sink_name=$PULSE_SINK" \
            >"$PULSE_LOG" 2>&1 &
          PULSE_PID=$!

          for attempt in {1..120}; do
            if [[ -S "$PULSE_RUNTIME/native" ]] && pactl info >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$PULSE_PID" 2>/dev/null; then
              echo "PulseAudio exited before accepting a connection" >&2
              exit 1
            fi
            sleep 0.25
          done
          if [[ ! -S "$PULSE_RUNTIME/native" ]] || ! pactl info >/dev/null 2>&1; then
            echo "PulseAudio did not accept a connection within 30 seconds" >&2
            exit 1
          fi
          if ! kill -0 "$PULSE_PID" 2>/dev/null; then
            echo "PulseAudio exited after becoming ready" >&2
            exit 1
          fi
          if ! pactl list short sinks | awk '$2 == "sunplayer_ci" { found = 1 } END { exit !found }'; then
            echo "PulseAudio did not expose the sunplayer_ci sink" >&2
            exit 1
          fi
          if [[ "$(pactl get-default-sink)" != "$PULSE_SINK" ]]; then
            echo "PulseAudio did not select sunplayer_ci as the default sink" >&2
            exit 1
          fi

          LAVAPIPE_ICD=/usr/share/vulkan/icd.d/lvp_icd.json
          if [[ ! -f "$LAVAPIPE_ICD" ]]; then
            echo "Ubuntu lavapipe ICD is missing: $LAVAPIPE_ICD" >&2
            exit 1
          fi
          export VK_DRIVER_FILES="$LAVAPIPE_ICD"
          vulkaninfo --summary

          ctest \
            --test-dir "$BUILD_DIR" \
            --output-on-failure \
            --parallel "$(nproc)"

          kill -0 "$WESTON_PID"
          kill -0 "$PULSE_PID"

  windows:
    name: Windows · Qt 6.11.1
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      application-version: ${{ steps.prepare-release.outputs.application_version }}
      release-sha: ${{ steps.prepare-release.outputs.release_sha }}
      store-version: ${{ steps.prepare-release.outputs.store_version }}
      tag: ${{ steps.prepare-release.outputs.tag }}
    env:
      VCPKG_ROOT: C:\vcpkg
      SUNPLAYER_PACKAGE_CONFIGURATION: ${{ inputs.release && 'RelWithDebInfo' || 'Release' }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare release revision
        id: prepare-release
        if: inputs.release
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          INITIAL_ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if ($env:INITIAL_ACTOR -ne 'usatiuk' -or $env:TRIGGERING_ACTOR -ne 'usatiuk') {
            throw 'Only usatiuk may start or re-run a release.'
          }
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must be created from main.'
          }

          $requiredVariables = @{
            WINDOWS_STORE_IDENTITY_NAME = $env:STORE_IDENTITY_NAME
            WINDOWS_STORE_PUBLISHER = $env:STORE_PUBLISHER
            WINDOWS_STORE_PUBLISHER_DISPLAY_NAME = $env:STORE_PUBLISHER_DISPLAY_NAME
          }
          foreach ($entry in $requiredVariables.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Configure the $($entry.Key) repository variable from Partner Center."
            }
          }

          $currentText = (Get-Content -LiteralPath VERSION.txt -Raw).Trim()
          if ($currentText -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw 'VERSION.txt must contain one X.Y.Z version.'
          }
          $parts = @()
          foreach ($part in @($Matches[1], $Matches[2], $Matches[3])) {
            $value = 0
            if (-not [uint16]::TryParse($part, [ref]$value)) {
              throw 'VERSION.txt components must be integers from 0 through 65535.'
            }
            $parts += [int]$value
          }
          switch ($env:BUMP) {
            'major' { $parts = @(($parts[0] + 1), 0, 0) }
            'minor' { $parts = @($parts[0], ($parts[1] + 1), 0) }
            'patch' { $parts = @($parts[0], $parts[1], ($parts[2] + 1)) }
            default { throw 'The release bump must be major, minor, or patch.' }
          }
          if ($parts.Where({ $_ -gt 65535 }).Count -ne 0) {
            throw 'The resulting version exceeds the Store component limit of 65535.'
          }
          if ($parts[0] -eq 0) {
            throw 'The Store requires a nonzero major version. Choose major for the first release.'
          }

          $applicationVersion = $parts -join '.'
          $storeVersion = "$applicationVersion.0"
          $tag = "v$applicationVersion"
          $originalSha = $env:GITHUB_SHA

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $remoteMain = (git rev-parse refs/remotes/origin/main).Trim()

          $remoteTag = (@(git ls-remote --tags origin "refs/tags/$tag") -join "`n").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect remote tag $tag." }

          if ($remoteMain -eq $originalSha -and [string]::IsNullOrEmpty($remoteTag)) {
            Set-Content -LiteralPath VERSION.txt -Value $applicationVersion
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add VERSION.txt
            git commit -m "Release $applicationVersion"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the local release commit.' }
            $releaseSha = (git rev-parse HEAD).Trim()
            git tag $tag $releaseSha
            if ($LASTEXITCODE -ne 0) { throw "Could not create local tag $tag." }
          }
          elseif (-not [string]::IsNullOrEmpty($remoteTag)) {
            if ([int]$env:RUN_ATTEMPT -le 1) {
              throw "$tag already exists; only a re-run may recover it."
            }
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing tag $tag." }
            $releaseSha = (git rev-parse "$tag^{commit}").Trim()
            $parentSha = (git rev-parse "$releaseSha^").Trim()
            $taggedVersion = (git show "${releaseSha}:VERSION.txt").Trim()
            if ($parentSha -ne $originalSha -or
                $taggedVersion -ne $applicationVersion) {
              throw "Existing refs for $tag do not match this release run."
            }
            git merge-base --is-ancestor $releaseSha refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "$tag is not part of origin/main history."
            }
            git checkout --detach $releaseSha
            if ($LASTEXITCODE -ne 0) { throw "Could not check out existing release $tag." }
          }
          else {
            throw 'origin/main moved after this release was dispatched.'
          }

          git branch --force release-build $releaseSha
          git bundle create "$env:RUNNER_TEMP\sunplayer-release.bundle" release-build "^$originalSha"
          if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the exact release commit.' }

          "application_version=$applicationVersion" >> $env:GITHUB_OUTPUT
          "release_sha=$releaseSha" >> $env:GITHUB_OUTPUT
          "store_version=$storeVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\Qt\6.11.1
          key: windows-2022-qt-6.11.1-msvc2022_64-with-sources-r2

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall @ https://github.com/miurahr/aqtinstall/archive/8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b.zip"
          python -m aqt install-qt `
            --outputdir "$env:RUNNER_TEMP\Qt" `
            windows desktop 6.11.1 win64_msvc2022_64 `
            -m qtshadertools
          python -m aqt install-src `
            --outputdir "$env:RUNNER_TEMP\Qt" `
            windows 6.11.1 `
            --archives qtbase qtdeclarative qtimageformats qtsvg

      - name: Verify Qt and vcpkg
        shell: pwsh
        run: |
          $qtRoot = "$env:RUNNER_TEMP\Qt\6.11.1\msvc2022_64"
          $binaryCache = "$env:RUNNER_TEMP\sunplayer-vcpkg-binary-cache"
          $requiredPaths = @(
            "$qtRoot\lib\cmake\Qt6\Qt6Config.cmake",
            "$qtRoot\lib\cmake\Qt6ShaderTools\Qt6ShaderToolsConfig.cmake",
            "$qtRoot\bin\qsb.exe",
            "$qtRoot\bin\windeployqt.exe",
            "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required dependency path is missing: $path"
            }
          }
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null

      - name: Resolve vcpkg cache identity
        id: vcpkg-cache
        shell: pwsh
        run: |
          $toolRevision = (git -C $env:VCPKG_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $toolRevision -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the hosted vcpkg revision.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'The hosted runner did not report its image version.'
          }
          "tool_revision=$toolRevision" >> $env:GITHUB_OUTPUT
          "image_version=$($env:ImageVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\sunplayer-vcpkg-binary-cache
          key: windows-2022-vcpkg-x64-windows-clangcl-r2-${{ steps.vcpkg-cache.outputs.image_version }}-${{ steps.vcpkg-cache.outputs.tool_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'cmake/vcpkg/**') }}
          restore-keys: |
            windows-2022-vcpkg-x64-windows-clangcl-r2-${{ steps.vcpkg-cache.outputs.image_version }}-${{ steps.vcpkg-cache.outputs.tool_revision }}-
            windows-2022-vcpkg-x64-windows-clangcl-r2-
            windows-2022-vcpkg-x64-windows-clangcl-r1-

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set "VCPKG_BINARY_SOURCES=clear;files,%RUNNER_TEMP%\sunplayer-vcpkg-binary-cache,readwrite"
          cmake -S . -B "%RUNNER_TEMP%\sunplayer-windows-debug" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" "-DVCPKG_INSTALLED_DIR=%RUNNER_TEMP%\sunplayer-vcpkg-installed" "-DCMAKE_PREFIX_PATH=%RUNNER_TEMP%\Qt\6.11.1\msvc2022_64"
          if errorlevel 1 exit /b %errorlevel%

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --build "%RUNNER_TEMP%\sunplayer-windows-debug" --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b %errorlevel%

      - name: Lint QML
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --build "%RUNNER_TEMP%\sunplayer-windows-debug" --target all_qmllint --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b %errorlevel%

      - name: Test deterministic boundaries
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          ctest --test-dir "%RUNNER_TEMP%\sunplayer-windows-debug" --output-on-failure --parallel %NUMBER_OF_PROCESSORS% -LE "device|gpu"
          if errorlevel 1 exit /b %errorlevel%

      - name: Configure distribution bundle
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set "VCPKG_BINARY_SOURCES=clear;files,%RUNNER_TEMP%\sunplayer-vcpkg-binary-cache,readwrite"
          cmake -S . -B "%RUNNER_TEMP%\sunplayer-windows-release" -G Ninja -DCMAKE_BUILD_TYPE=%SUNPLAYER_PACKAGE_CONFIGURATION% -DBUILD_TESTING=OFF "-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" "-DVCPKG_INSTALLED_DIR=%RUNNER_TEMP%\sunplayer-vcpkg-installed" "-DCMAKE_PREFIX_PATH=%RUNNER_TEMP%\Qt\6.11.1\msvc2022_64"
          if errorlevel 1 exit /b %errorlevel%

      - name: Build distribution bundle
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --build "%RUNNER_TEMP%\sunplayer-windows-release" --target sunplayer --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b %errorlevel%

      - name: Stage distribution bundle
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --install "%RUNNER_TEMP%\sunplayer-windows-release" --config %SUNPLAYER_PACKAGE_CONFIGURATION% --prefix "%RUNNER_TEMP%\sunplayer-windows-artifact"
          if errorlevel 1 exit /b %errorlevel%
          if not exist "%RUNNER_TEMP%\sunplayer-windows-artifact\bin\qt.conf" exit /b 1
          "%RUNNER_TEMP%\sunplayer-windows-artifact\bin\sunplayer.exe" --verify-qml
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload Windows developer bundle
        if: inputs.release != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunplayer-windows-release-${{ github.sha }}
          path: ${{ runner.temp }}\sunplayer-windows-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Set up winapp
        uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495 # v0.2
        with:
          version: v0.6.0

      - name: Verify winapp
        shell: pwsh
        run: |
          $winapp = (Get-Command winapp -CommandType Application -ErrorAction Stop).Source
          $expected = @{
            'libSkiaSharp.dll' = '9A0D95E8CAAA852C70D085AF6A40A744242172AD9EA3FD6BC7599875A8A1DBCD'
            'winapp.exe' = '0AA2A43086AD07C7FDC35C94ECCA0A586E815B1AB46E9B3109D73123E9190C90'
            'winapp.pdb' = '56E7B951A0A6F9969A21C764C4E1A39BA29DBC056DF2AE3B9A77CBD727A052A7'
          }
          $entries = @(Get-ChildItem -LiteralPath (Split-Path $winapp) -Force)
          $nameDifference = Compare-Object @($expected.Keys | Sort-Object) @($entries.Name | Sort-Object)
          if ($nameDifference -or ($entries | Where-Object PSIsContainer)) {
            throw "Unexpected contents in the winapp v0.6.0 release archive."
          }
          foreach ($file in $entries) {
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            if ($actual -ne $expected[$file.Name]) {
              throw "winapp v0.6.0 hash mismatch for $($file.Name)."
            }
          }

      - name: Package unsigned development MSIX
        if: inputs.release != true
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          pwsh -NoLogo -NoProfile -File packaging\windows\Package-WindowsStore.ps1 -InstallPrefix "%RUNNER_TEMP%\sunplayer-windows-artifact" -Output "%RUNNER_TEMP%\SunPlayerDevelopment.msix" -PackageVersion 1.0.0.0 -IdentityName SunPlayerDevelopment -Publisher "CN=SunPlayerDevelopment" -PublisherDisplayName "SunPlayer Development"
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload unsigned development MSIX
        if: inputs.release != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunplayer-windows-msix-${{ github.sha }}
          path: ${{ runner.temp }}\SunPlayerDevelopment.msix
          if-no-files-found: error
          retention-days: 7

      - name: Package Store MSIX upload
        if: inputs.release
        shell: pwsh
        env:
          STORE_PACKAGE_VERSION: ${{ steps.prepare-release.outputs.store_version }}
          STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $msix = Join-Path $env:RUNNER_TEMP "SunPlayer_$($env:STORE_PACKAGE_VERSION)_x64.msix"
          & .\packaging\windows\Package-WindowsStore.ps1 `
            -InstallPrefix "$env:RUNNER_TEMP\sunplayer-windows-artifact" `
            -Output $msix `
            -PackageVersion $env:STORE_PACKAGE_VERSION `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

          $pdb = Join-Path $env:RUNNER_TEMP 'sunplayer-windows-release\sunplayer.pdb'
          if (-not (Test-Path -LiteralPath $pdb -PathType Leaf) -or
              (Get-Item -LiteralPath $pdb).Length -eq 0) {
            throw "The full SunPlayer linker PDB is missing: $pdb"
          }
          if (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\sunplayer-windows-artifact" -Filter *.pdb -File -Recurse) {
            throw 'PDB files must remain outside the installed MSIX payload.'
          }

          $symbolZip = Join-Path $env:RUNNER_TEMP 'SunPlayerSymbols.zip'
          $appxSym = Join-Path $env:RUNNER_TEMP "SunPlayer_$($env:STORE_PACKAGE_VERSION)_x64.appxsym"
          Compress-Archive `
            -LiteralPath $pdb `
            -DestinationPath $symbolZip `
            -CompressionLevel Optimal
          Move-Item -LiteralPath $symbolZip -Destination $appxSym

          $zip = Join-Path $env:RUNNER_TEMP 'SunPlayerStoreUpload.zip'
          $upload = Join-Path $env:RUNNER_TEMP "SunPlayer_$($env:STORE_PACKAGE_VERSION)_x64.msixupload"
          Compress-Archive -LiteralPath @($msix, $appxSym) -DestinationPath $zip -CompressionLevel Optimal
          Move-Item -LiteralPath $zip -Destination $upload

      - name: Upload release inputs
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunplayer-release-${{ steps.prepare-release.outputs.application_version }}
          path: |
            ${{ runner.temp }}\SunPlayer_${{ steps.prepare-release.outputs.store_version }}_x64.msixupload
            ${{ runner.temp }}\sunplayer-release.bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish release
    if: >-
      inputs.release &&
      github.actor == 'usatiuk' &&
      github.triggering_actor == 'usatiuk' &&
      github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out dispatch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sunplayer-release-${{ needs.windows.outputs.application-version }}
          path: ${{ runner.temp }}/sunplayer-release

      - name: Push exact release revision
        env:
          ORIGINAL_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ needs.windows.outputs.release-sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/sunplayer-release/sunplayer-release.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/release-build:refs/heads/release-build
          [[ "$(git rev-parse refs/heads/release-build)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse "$RELEASE_SHA^")" == "$ORIGINAL_SHA" ]]

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          remote_main="$(git rev-parse refs/remotes/origin/main)"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"

          if [[ "$remote_main" == "$ORIGINAL_SHA" && -z "$remote_tag" ]]; then
            git tag "$TAG" "$RELEASE_SHA"
            git push --atomic origin \
              "$RELEASE_SHA:refs/heads/main" \
              "refs/tags/$TAG:refs/tags/$TAG"
          elif [[ "$remote_tag" != "$RELEASE_SHA" ]]; then
            echo "Remote $TAG conflicts with this release." >&2
            exit 1
          elif (( RUN_ATTEMPT <= 1 )); then
            echo "$TAG already exists; only a re-run may recover it." >&2
            exit 1
          elif ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "$TAG is not part of origin/main history." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_VERSION: ${{ needs.windows.outputs.store-version }}
          TAG: ${{ needs.windows.outputs.tag }}
          VERSION: ${{ needs.windows.outputs.application-version }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/sunplayer-release/SunPlayer_${STORE_VERSION}_x64.msixupload"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            asset_name="$(basename "$upload")"
            asset_info="$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$asset_name\") | .size")"
            if [[ -z "$asset_info" ]]; then
              gh release upload "$TAG" "$upload" --repo "$GITHUB_REPOSITORY"
            else
              if [[ "$asset_info" -le 0 ]]; then
                echo "Existing release asset $asset_name is incomplete; refusing to replace it." >&2
                exit 1
              fi
              echo "Release asset $asset_name already exists; leaving it unchanged."
            fi
          else
            gh release create "$TAG" "$upload" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SunPlayer $VERSION" \
              --generate-notes \
              --verify-tag
          fi
